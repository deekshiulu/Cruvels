# Pings the free Render mail worker so it does not sleep.
# Add repo secret WORKER_HEALTH_URL = https://<your-service>.onrender.com/health
name: Keep mail worker awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render /health
        env:
          WORKER_HEALTH_URL: ${{ secrets.WORKER_HEALTH_URL }}
        run: |
          if [ -z "$WORKER_HEALTH_URL" ]; then
            echo "WORKER_HEALTH_URL secret is not set. Skipping keep-alive."
            exit 0
          fi
          curl -fsS --max-time 20 "$WORKER_HEALTH_URL"
