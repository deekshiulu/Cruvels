<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Cruvels Workplace OS</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <style>
    :root {
      --bg: #0B0F19;
      --card-bg: #111827;
      --text: #F9FAFB;
      --text-muted: #9CA3AF;
      --teal: #0D9488;
      --teal-hover: #14B8A6;
      --border: #1F2937;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #F8FAFC;
        --card-bg: #FFFFFF;
        --text: #0F172A;
        --text-muted: #64748B;
        --teal: #0D9488;
        --teal-hover: #0F766E;
        --border: #E2E8F0;
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }
    .icon-wrapper {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.5rem;
      border-radius: 1.25rem;
      background: rgba(13, 148, 136, 0.15);
      border: 1px solid rgba(13, 148, 136, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-wrapper svg {
      width: 32px;
      height: 32px;
      color: var(--teal);
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin-bottom: 0.5rem;
    }
    p {
      color: var(--text-muted);
      font-size: 0.875rem;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 44px;
      padding: 0.75rem 1.25rem;
      background-color: var(--teal);
      color: #FFFFFF;
      font-size: 0.875rem;
      font-weight: 700;
      border: none;
      border-radius: 0.875rem;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.15s ease;
    }
    .btn:hover {
      background-color: var(--teal-hover);
    }
    .badge {
      display: inline-block;
      margin-top: 1.25rem;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: rgba(13, 148, 136, 0.1);
      color: var(--teal);
      border: 1px solid rgba(13, 148, 136, 0.2);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 4.243a9 9 0 01-2.828-6.364 9 9 0 012.828-6.364m0 0l2.829 2.829m-2.829-2.829L3 3m5.657 5.657a5 5 0 017.07 0" />
      </svg>
    </div>
    <h1>You are Currently Offline</h1>
    <p>
      Cruvels Workplace OS cannot connect to the enterprise server. Please check your internet connection to sync attendance, tasks, and mail.
    </p>
    <button class="btn" onclick="window.location.reload()">
      Retry Connection
    </button>
    <div>
      <span class="badge">Cruvels PWA Offline Shell</span>
    </div>
  </div>
</body>
</html>
